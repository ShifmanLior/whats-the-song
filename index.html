<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>מה השיר?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>

  /* Monochrome, Uber-like: flat black and white, hairlines, bold type. State is shown with
     fill, outline and icons rather than colour. Dark mode inverts the same tokens. */
  :root {
    color-scheme: light dark;
    --paper: #ffffff;
    --ink: #000000;
    --muted: #6b6b6b;
    --line: #e2e2e2;
    --soft: #f3f3f3;
    --soft-2: #e8e8e8;
    --mid: #bdbdbd;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #000000;
      --ink: #ffffff;
      --muted: #9b9b9b;
      --line: #2b2b2b;
      --soft: #141414;
      --soft-2: #1f1f1f;
      --mid: #4d4d4d;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    color: var(--ink);
    font-family: "Heebo", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

  .app {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
    padding: 28px 20px 56px;
  }

  /* header */
  .top {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  h1 { margin: 0; font-size: 38px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; }
  .sub { margin: 6px 0 0; color: var(--muted); font-size: 14px; font-weight: 500; }
  .stats { display: flex; gap: 8px; }
  .stat {
    min-width: 60px;
    padding: 6px 10px;
    text-align: center;
    background: var(--soft);
    border-radius: 10px;
  }
  .stat b { display: block; font-size: 20px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .stat span { display: block; color: var(--muted); font-size: 12px; }
  .lead { margin: 18px 0 0; color: var(--muted); font-size: 15px; }

  /* player stage */
  .stage { margin-top: 32px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .stage[hidden] { display: none; }
  .play {
    position: relative;
    width: 88px; height: 88px;
    border: 0; border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    cursor: pointer;
    display: grid; place-items: center;
    transition: transform .12s ease;
  }
  .play:hover:not(:disabled) { transform: scale(1.05); }
  .play:active:not(:disabled) { transform: scale(0.96); }
  .play:disabled { cursor: progress; opacity: .35; }
  .play svg { width: 36px; height: 36px; fill: currentColor; grid-area: 1 / 1; }
  .play .i-pause { display: none; }
  .play[data-state="playing"] .i-play { display: none; }
  .play[data-state="playing"] .i-pause { display: block; }
  .play[data-state="playing"]::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 2px solid var(--ink); opacity: 0;
    animation: pulse 1.2s ease-out infinite;
  }
  .play[data-state="loading"]::after {
    content: ""; position: absolute; inset: -8px; border-radius: 50%;
    border: 2px solid transparent; border-top-color: var(--ink);
    animation: spin .8s linear infinite;
  }
  @keyframes pulse { from { transform: scale(0.9); opacity: .6; } to { transform: scale(1.25); opacity: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .timeline-wrap { width: 100%; }
  .timeline {
    position: relative;
    height: 6px;
    background: var(--soft-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .tl-unlocked, .tl-played { position: absolute; inset-block: 0; left: 0; }
  .tl-unlocked { background: var(--mid); transition: width .35s ease; }
  .tl-played { background: var(--ink); }
  .tl-tick { position: absolute; inset-block: 0; width: 2px; background: var(--paper); }
  .tl-marks { position: relative; height: 20px; margin-top: 8px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .tl-marks span { position: absolute; transform: translateX(-50%); }
  .tl-marks span:last-child { transform: translateX(-100%); }
  .tl-label { text-align: center; color: var(--muted); font-size: 14px; }

  /* guess history: correct = solid, wrong = struck through, skipped = dashed */
  .attempts { list-style: none; margin: 24px 0 0; padding: 0; display: grid; gap: 8px; }
  .attempts:empty { display: none; }
  .attempt {
    display: flex; align-items: center; gap: 12px;
    min-height: 48px; padding: 7px 14px 7px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 15px;
  }
  .attempt .badge {
    flex: none; min-width: 34px; height: 34px; padding: 0 6px; border-radius: 8px;
    display: grid; place-items: center;
    background: var(--soft); color: var(--muted);
    font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums;
  }
  .attempt .txt { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .attempt.bad .txt { color: var(--muted); text-decoration: line-through; }
  .attempt.bad::after { content: "\2715"; font-weight: 700; }
  .attempt.skip { border-style: dashed; border-color: var(--mid); }
  .attempt.skip .txt { color: var(--muted); }
  .attempt.win { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .attempt.win .badge { background: var(--paper); color: var(--ink); }
  .attempt.win::after { content: "\2713"; font-weight: 800; }

  /* guess area */
  .guess { margin-top: 20px; }
  .guess[hidden] { display: none; }
  .combo { position: relative; }
  .combo input {
    width: 100%; height: 54px; padding: 0 16px;
    background: var(--soft);
    border: 2px solid transparent;
    border-radius: var(--radius);
    font-size: 17px;
  }
  .combo input::placeholder { color: var(--muted); }
  .combo input:focus { outline: none; border-color: var(--ink); background: var(--paper); }
  .list {
    position: absolute; z-index: 5; inset-inline: 0; top: calc(100% + 6px);
    margin: 0; padding: 6px; list-style: none;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: 0 14px 36px rgba(0, 0, 0, .16);
    max-height: 320px; overflow-y: auto;
  }
  .list[hidden] { display: none; }
  .list li { padding: 10px 12px; border-radius: 8px; cursor: pointer; }
  .list li b { display: block; font-weight: 700; }
  .list li small { display: block; color: var(--muted); font-size: 13px; }
  .list li[aria-selected="true"], .list li:hover { background: var(--soft); }
  .list li.status { color: var(--muted); font-size: 14px; cursor: default; }
  .list li.status:hover { background: none; }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .btn {
    height: 52px; border-radius: var(--radius); border: 2px solid transparent;
    font-weight: 700; font-size: 16px; cursor: pointer;
    transition: transform .1s ease, background-color .15s ease;
  }
  .btn:active:not(:disabled) { transform: scale(0.98); }
  .btn:disabled { opacity: .3; cursor: not-allowed; }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.ghost { background: var(--soft); color: var(--ink); }
  .btn.ghost:hover:not(:disabled) { background: var(--soft-2); }
  .btn.danger { background: transparent; border-color: var(--ink); }

  /* result: an inverted card, so the end of the game stands out */
  .result {
    margin-top: 20px; padding: 24px 20px;
    background: var(--ink);
    color: var(--paper);
    border-radius: 16px;
    text-align: center;
  }
  .result[hidden] { display: none; }
  .result h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .song-title { margin: 14px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
  .song-artist { margin: 0; opacity: .7; }
  .squares { display: flex; justify-content: center; gap: 5px; margin: 18px 0; }
  .squares i {
    position: relative; flex: 1 1 0; max-width: 28px; aspect-ratio: 1; border-radius: 7px;
    border: 1px solid var(--paper); opacity: .3;
  }
  .squares i.win { background: var(--paper); border-color: var(--paper); opacity: 1; }
  .squares i.skip { background: var(--paper); opacity: .35; }
  .squares i.bad { border-width: 2px; opacity: 1; }
  .squares i.bad::before, .squares i.bad::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 2px;
    margin: -1px 0 0 -7px; background: var(--paper); transform: rotate(45deg);
  }
  .squares i.bad::after { transform: rotate(-45deg); }
  .result .btn { width: 100%; }
  .result .btn.primary { background: var(--paper); color: var(--ink); }
  .next { margin: 16px 0 0; opacity: .7; font-size: 14px; }
  .next b { font-variant-numeric: tabular-nums; }

  /* YouTube player: kept off-screen while guessing, shown at the end */
  .player-wrap {
    position: fixed; left: -10000px; top: 0;
    width: 220px; height: 220px;
    pointer-events: none;
  }
  .player-wrap iframe { width: 100%; height: 100%; border: 0; border-radius: var(--radius); }
  .player-wrap.revealed {
    position: static; left: auto;
    width: 100%; height: auto; aspect-ratio: 16 / 9;
    margin-top: 16px; pointer-events: auto;
  }

  .notice {
    margin: 16px 0 0; padding: 12px 14px;
    background: var(--soft); border: 1px solid var(--ink); border-radius: var(--radius);
    font-size: 14px;
  }
  .notice[hidden] { display: none; }
  .notice code { direction: ltr; unicode-bidi: embed; background: var(--soft-2); padding: 1px 6px; border-radius: 6px; }
  .foot { margin-top: 32px; text-align: center; color: var(--muted); font-size: 13px; }

  .toast {
    position: fixed; inset-inline: 0; bottom: 24px; margin: 0 auto; width: max-content; max-width: calc(100% - 32px);
    padding: 10px 18px; border-radius: 999px;
    background: var(--ink); color: var(--paper); font-weight: 700;
    opacity: 0; transform: translateY(12px); pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
  }
  .toast.show { opacity: 1; transform: none; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* small phones: keep the guess box and buttons above the fold */
  @media (max-width: 480px) {
    .app { padding: 16px 16px 48px; }
    h1 { font-size: 30px; }
    .top { padding-bottom: 14px; }
    .lead { margin-top: 10px; font-size: 14px; }
    .stage { margin-top: 18px; gap: 12px; }
    .play { width: 76px; height: 76px; }
    .play svg { width: 32px; height: 32px; }
    .attempts { margin-top: 14px; gap: 5px; }
    .attempt { min-height: 38px; padding-block: 2px; }
    .attempt .badge { min-width: 30px; height: 28px; }
    .guess { margin-top: 14px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <h1>מה השיר?</h1>
      <p class="sub" id="dayLabel"></p>
    </div>
    <div class="stats">
      <div class="stat"><b id="statStreak">0</b><span>רצף</span></div>
      <div class="stat"><b id="statWins">0</b><span>ניצחונות</span></div>
    </div>
  </header>
  <p class="lead">שיר חדש בכל יום. מתחילים עם חצי שנייה מתחילת השיר, וכל דילוג או ניחוש שגוי מוסיפים עוד חצי שנייה, עד 5 שניות.</p>

  <section class="stage" id="stage" aria-label="נגן">
    <button class="play" id="play" type="button" aria-label="נגן את הקטע" data-state="loading" disabled>
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72a1 1 0 0 0 1.5.86l11-6.86a1 1 0 0 0 0-1.72l-11-6.86A1 1 0 0 0 8 5.14z"/></svg>
      <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
    </button>
    <div class="timeline-wrap" dir="ltr">
      <div class="timeline" id="timeline" aria-hidden="true">
        <div class="tl-unlocked" id="tlUnlocked"></div>
        <div class="tl-played" id="tlPlayed"></div>
      </div>
      <div class="tl-marks" id="tlMarks" aria-hidden="true"></div>
    </div>
    <div class="tl-label" id="tlLabel"></div>
  </section>

  <section class="guess" id="guess" aria-label="ניחוש">
    <div class="combo">
      <label class="sr-only" for="q">חפשו שיר או אמן</label>
      <input id="q" type="text" role="combobox" aria-expanded="false" aria-controls="list" aria-autocomplete="list"
             autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="התחילו להקליד ובחרו מהרשימה">
      <ul class="list" id="list" role="listbox" aria-label="הצעות" hidden></ul>
    </div>
    <div class="actions">
      <button class="btn primary" id="guessBtn" type="button" disabled>נחשו</button>
      <button class="btn ghost" id="skipBtn" type="button">עוד חצי שנייה</button>
    </div>
  </section>

  <section class="result" id="result" hidden aria-live="polite">
    <h2 id="resultTitle"></h2>
    <p class="song-title" id="resultSong"></p>
    <p class="song-artist" id="resultArtist"></p>
    <div class="squares" id="resultSquares" aria-hidden="true"></div>
    <button class="btn primary" id="shareBtn" type="button">שתפו תוצאה</button>
    <p class="next">השיר הבא בעוד <b id="countdown">--:--:--</b></p>
  </section>

  <div class="player-wrap" id="playerWrap"></div>

  <ol class="attempts" id="attempts" aria-label="הניחושים שלכם"></ol>

  <p class="notice" id="notice" role="alert" hidden></p>
  <p class="foot">השיר מתחלף בחצות</p>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="sr-only" id="live" aria-live="polite"></div>

<script src="songs.js"></script>
<script>
(() => {
  'use strict';

  const STAGES = Array.from({ length: 10 }, (_, i) => (i + 1) / 2);   // 0.5s up to 5s, half a second more per attempt
  const STOP_LEAD = 0.2;                            // stop this early: pausing takes ~0.2s to reach the player (measured with ?debug)
  const MAX = STAGES[STAGES.length - 1];
  const EPOCH = Date.UTC(2026, 9, 31);              // day #1 is 31 Oct 2026
  const STORE_KEY = 'whats-the-song.v1';
  const SHARE_URL = 'https://whats-the-song.vercel.app/';   // link added to shared results
  const SONGS = window.SONGS;
  const BY_ID = new Map(SONGS.map((s) => [s.id, s]));
  const $ = (id) => document.getElementById(id);

  // ---------- which song is today's ----------
  const params = new URLSearchParams(location.search);
  const previewMode = params.has('day');            // ?day=5 previews another day without saving anything
  const dayNumberOf = (d) => Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - EPOCH) / 86400000) + 1;
  const today = dayNumberOf(new Date());
  const dayNo = previewMode ? (parseInt(params.get('day'), 10) || 1) : today;
  const answer = SONGS[(((dayNo - 1) % SONGS.length) + SONGS.length) % SONGS.length];

  // ---------- saved progress ----------
  let store = { days: {} };
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY));
    if (raw && raw.days) store = raw;
  } catch (e) { /* storage unavailable: play without saving */ }
  const rec = previewMode ? { g: [], done: false, won: false } : (store.days[dayNo] ||= { g: [], done: false, won: false });
  const persist = () => {
    if (previewMode) return;
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch (e) { /* ignore */ }
  };

  function computeStats() {
    let wins = 0;
    for (const k in store.days) if (store.days[k].done && store.days[k].won) wins++;
    let streak = 0;
    let n = today;
    if (!(store.days[n] && store.days[n].done)) n--;   // today not finished yet: streak runs through yesterday
    while (store.days[n] && store.days[n].won) { streak++; n--; }
    return { wins, streak };
  }

  // ---------- small helpers ----------
  const stageIndex = () => Math.min(rec.g.length, STAGES.length - 1);
  const secsUnlocked = () => STAGES[stageIndex()];
  const label = (s) => `${s.artist} - ${s.title}`;
  // older saves stored guesses as song ids: convert them to { t: text, ok: correct }
  rec.g = rec.g.map((x) => (x === 'skip' || typeof x === 'object') ? x
    : BY_ID.has(x) ? { t: label(BY_ID.get(x)), ok: x === answer.id } : { t: String(x), ok: false });
  function announce(msg) { $('live').textContent = ''; setTimeout(() => { $('live').textContent = msg; }, 30); }
  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }
  function showNotice(html) { const n = $('notice'); n.innerHTML = html; n.hidden = false; }

  // ---------- rendering ----------
  function buildTimeline() {
    const tl = $('timeline'), marks = $('tlMarks');
    STAGES.forEach((s, i) => {
      const pct = (s / MAX) * 100;
      if (i < STAGES.length - 1) {
        const tick = document.createElement('div');
        tick.className = 'tl-tick'; tick.style.left = pct + '%';
        tl.appendChild(tick);
      }
      if (!Number.isInteger(s)) return;             // label whole seconds only, ten labels would not fit
      const m = document.createElement('span');
      m.textContent = s; m.style.left = pct + '%';
      marks.appendChild(m);
    });
  }

  function renderAttempts() {
    const ol = $('attempts');
    ol.textContent = '';
    for (let i = rec.g.length - 1; i >= 0; i--) {   // newest first, under the guess box
      const li = document.createElement('li');
      const badge = document.createElement('span'); badge.className = 'badge'; badge.textContent = STAGES[i];
      const txt = document.createElement('span'); txt.className = 'txt';
      const g = rec.g[i];
      let cls;
      if (g === 'skip') { cls = 'skip'; txt.textContent = 'דילגתם'; }
      else { cls = g.ok ? 'win' : 'bad'; txt.textContent = g.t; }
      li.className = 'attempt ' + cls;
      li.append(badge, txt);
      ol.appendChild(li);
    }
  }

  const secsText = (s) => (s === 0.5 ? 'חצי שנייה' : s === 1 ? 'שנייה אחת' : `${s} שניות`);
  function renderControls() {
    const s = secsUnlocked();
    $('tlUnlocked').style.width = (s / MAX) * 100 + '%';
    $('tlLabel').textContent = `${secsText(s)} מתחילת השיר, ניסיון ${Math.min(rec.g.length + 1, STAGES.length)} מתוך ${STAGES.length}`;
    const i = rec.g.length;
    const last = i >= STAGES.length - 1;
    const skip = $('skipBtn');
    skip.textContent = last ? 'ויתור' : `עוד ${secsText(STAGES[i + 1] - STAGES[i])}`;
    skip.classList.toggle('danger', last);
    $('stage').hidden = rec.done;
    $('guess').hidden = rec.done;
    const st = computeStats();
    $('statStreak').textContent = st.streak;
    $('statWins').textContent = st.wins;
  }

  function squaresFor(g) {
    return STAGES.map((_, i) => {
      const v = g[i];
      if (v === undefined) return '';
      return v === 'skip' ? 'skip' : v.ok ? 'win' : 'bad';
    });
  }

  function renderResult() {
    const box = $('result');
    box.hidden = false;
    box.classList.toggle('won', rec.won);
    box.classList.toggle('lost', !rec.won);
    $('resultTitle').textContent = rec.won ? `נכון! ניחשתם בניסיון ${rec.g.length}` : 'לא הפעם';
    $('resultSong').textContent = answer.title;
    $('resultArtist').textContent = answer.artist;
    const sq = $('resultSquares'); sq.textContent = '';
    squaresFor(rec.g).forEach((c) => { const i = document.createElement('i'); if (c) i.className = c; sq.appendChild(i); });
    $('playerWrap').classList.add('revealed');
    tickCountdown();
  }

  function render() {
    renderAttempts();
    renderControls();
    if (rec.done) renderResult();
  }

  // ---------- YouTube player: play only the first N seconds ----------
  let player = null, playerReady = false, clip = null;
  let pending = null;                               // 'clip' or 'full': waits for a fresh player to get ready

  // Chromium lists whatever a YouTube iframe has played in its media notification, lock screen and media hub, with the
  // video's title, channel and a frame of it, which gives the answer away. So after every clip the iframe is thrown
  // away and a fresh one that has never played takes its place. Safari keeps one iframe: its autoplay rules are
  // stricter and a new iframe per clip could not be tested there.
  const RETIRE_PLAYERS = !!navigator.userAgentData;     // only Chromium has this

  function setPlayState(state) {
    const b = $('play');
    b.dataset.state = state;
    b.disabled = state === 'loading' && !playerReady;
    b.setAttribute('aria-label', state === 'playing' ? 'עצרו' : 'נגנו את הקטע');
  }

  function startClip() {
    if (rec.done) return;
    if (!playerReady) { pending = 'clip'; setPlayState('loading'); return; }   // a fresh player is still loading
    stopClip(false);
    const start = answer.start || 0;
    const len = secsUnlocked();
    clip = { start, len, armed: false, wall0: 0, stalledAt: 0, nudgedAt: 0, launched: performance.now() };
    player.seekTo(start, true);
    player.playVideo();
    setPlayState('loading');
    $('play').disabled = false;
    clip.timer = setInterval(tick, 16);
  }

  // The clip clock starts when YouTube reports PLAYING, not on click, so loading never eats into a short clip.
  // getCurrentTime only updates in coarse steps, which is too blunt for half a second.
  function onPlayerState(st) {                      // 1 playing, 2 paused, 3 buffering
    if (!clip) return;
    const now = performance.now();
    if (st === 1) {
      if (!clip.armed) { clip.armed = true; clip.wall0 = now; setPlayState('playing'); }
      else if (clip.stalledAt) { clip.wall0 += now - clip.stalledAt; clip.stalledAt = 0; }
    } else if (st === 3 && clip.armed && !clip.stalledAt) {
      clip.stalledAt = now;                         // buffering mid-clip: hold the clock
    } else if (st === 2 && clip.armed) {
      stopClip();                                   // paused from outside
    }
  }

  function tick() {
    if (!clip) return;
    const now = performance.now();
    if (!clip.armed) {
      const st = player.getPlayerState();           // 1 playing, 2 paused, 3 buffering, 5 cued
      if (now - clip.launched > 12000) {
        stopClip();
        showNotice('הנגן לא הצליח להתחיל להשמיע. נסו לרענן את העמוד.');
      } else if (st === 1 && now - clip.launched > 250) {
        // the PLAYING event was missed: arm from the media position instead
        clip.armed = true; setPlayState('playing');
        clip.wall0 = now - Math.max(0, player.getCurrentTime() - clip.start) * 1000;
      } else if ((st === 2 || st === 5 || st === -1) && now - clip.launched > 1500 && now - clip.nudgedAt > 1500) {
        clip.nudgedAt = now; player.playVideo();
      }
      return;
    }
    const elapsed = ((clip.stalledAt || now) - clip.wall0) / 1000;
    $('tlPlayed').style.width = (Math.min(elapsed, clip.len) / MAX) * 100 + '%';
    if (elapsed >= clip.len - STOP_LEAD) stopClip();
  }

  function stopClip(retire = true) {
    if (clip) {
      const c = clip, old = player;
      clearInterval(c.timer); clip = null;
      try { old.pauseVideo(); } catch (e) { /* not ready */ }
      const swap = retire && RETIRE_PLAYERS;
      if (swap) buildPlayer();
      // the old iframe goes only after the pause has reached it, or the clip would end early;
      // ?debug logs how far the media really advanced, to tune STOP_LEAD
      if (swap || (params.has('debug') && c.armed)) {
        setTimeout(() => {
          if (params.has('debug') && c.armed) console.log(`clip ${c.len}s: media advanced ${(old.getCurrentTime() - c.start).toFixed(2)}s`);
          if (swap) { try { old.destroy(); } catch (e) { /* already gone */ } }
        }, 700);
      }
    }
    $('tlPlayed').style.width = '0%';
    setPlayState('idle');
  }

  const YT_ERRORS = { 2: 'מזהה סרטון לא תקין', 5: 'שגיאת נגן', 100: 'הסרטון הוסר או פרטי', 101: 'הבעלים חסם הטמעה', 150: 'הבעלים חסם הטמעה', 153: 'הנגן לא קיבל מקור (Referer)' };

  function buildPlayer() {
    const holder = document.createElement('div');
    $('playerWrap').appendChild(holder);
    const vars = { playsinline: 1, rel: 0, modestbranding: 1, controls: 1, disablekb: 1, start: answer.start || 0 };
    if (/^https?:$/.test(location.protocol)) vars.origin = location.origin;
    playerReady = false;
    const me = player = new YT.Player(holder, {
      width: '100%', height: '100%', videoId: answer.id, playerVars: vars,
      events: {
        onReady: () => {
          if (me !== player) return;
          playerReady = true;
          const job = pending; pending = null;
          if (job === 'clip') startClip();
          else if (job === 'full') playFull();
          else setPlayState('idle');
        },
        onStateChange: (e) => { if (me === player) onPlayerState(e.data); },
        onError: (e) => {
          if (me !== player) return;
          pending = null;
          stopClip(false);
          showNotice(`הסרטון של היום לא מתנגן כאן: ${YT_ERRORS[e.data] || 'שגיאה ' + e.data}. השיר: ${label(answer)}.`);
        },
      },
    });
  }

  function playFull() {                             // the whole song, once the game is over
    if (!playerReady) { pending = 'full'; return; }
    player.seekTo(0, true); player.playVideo();
  }

  function loadYouTube() {
    if (location.protocol === 'file:') {
      showNotice('יוטיוב לא משמיע כשהעמוד נפתח ישר מהקובץ. הריצו בתיקייה <code>python3 -m http.server 8123</code> ופתחו <code>localhost:8123</code>.');
      return;
    }
    window.onYouTubeIframeAPIReady = buildPlayer;
    const s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = () => showNotice('לא הצלחתי לטעון את הנגן של יוטיוב. בדקו את החיבור לאינטרנט.');
    document.head.appendChild(s);
  }

  // ---------- guessing ----------
  function submit(entry) {                          // entry: 'skip' or { t: guess text, ok: correct }
    if (rec.done) return;
    rec.g.push(entry);
    const won = entry !== 'skip' && entry.ok;
    if (won || rec.g.length >= STAGES.length) { rec.done = true; rec.won = won; }
    stopClip(!rec.done);                            // at the end the same player goes on to play the whole song
    persist();
    cancelSearch(); matches = [];
    $('q').value = ''; picked = null; $('guessBtn').disabled = true; closeList();
    render();
    if (rec.done) {
      announce(won ? 'נכון!' : 'לא הפעם');
      playFull();
    } else {
      announce(entry === 'skip' ? 'דילגתם' : 'ניחוש שגוי');
      startClip();
    }
  }

  // ---------- autocomplete ----------
  const input = $('q'), list = $('list');
  let matches = [], active = -1, picked = null;
  const norm = (s) => s.toLowerCase().normalize('NFD')
    .replace(/[̀-֑ͯ-ׇ]/g, '')
    .replace(/['’‘`׳]/g, '')            // apostrophes vanish: "ג'ין" is "גין", "V'eAta" is "veata"
    .replace(/[^\p{L}\p{N}\s]/gu, ' ')
    .replace(/\s+/g, ' ').trim();
  SONGS.forEach((s) => { s._hay = norm([s.artist, s.title, ...(s.artistAlt || []), ...(s.titleAlt || [])].join(' ')); });

  // ---------- judging a guess ----------
  const STOP_WORDS = new Set(['the', 'and', 'feat', 'ft', 'with', 'של']);
  const stripExtras = (s) => s.replace(/\(.*?\)|\[.*?\]/g, ' ').replace(/\s[-–]\s.*$/, '');   // "(Remastered)", "- Live"
  const hasPhrase = (text, phrase) => ` ${text} `.includes(` ${phrase} `);
  // A guess is only ever compared with today's song, so the matching can afford to be generous:
  // small spelling slips are forgiven, and Hebrew spellings of English names match through the aliases in songs.js.
  //
  // Hebrew has several spellings for one sound (בילי / ביילי, ג'ין / גין), so Hebrew words are reduced to a key:
  // vowel letters after the first letter are dropped, look-alike consonants are merged, doubled letters are collapsed.
  const HE = /[֐-׿]/;
  const HE_MERGE = { ק: 'כ', ך: 'כ', ח: 'כ', ט: 'ת', ש: 'ס', ז: 'ס', צ: 'ס', ץ: 'ס', ף: 'פ', ם: 'מ', ן: 'נ', ע: 'א' };
  function hebKey(word) {
    let out = '';
    [...word].forEach((c, i) => {
      if (i > 0 && 'אהויע'.includes(c)) return;
      c = HE_MERGE[c] || c;
      if (out[out.length - 1] !== c) out += c;
    });
    return out;
  }
  const keyOf = (s) => s.split(' ').filter(Boolean).map((w) => (HE.test(w) ? hebKey(w) : w)).join('');

  function editDist(a, b) {                          // Damerau-Levenshtein: a swap of two neighbours is one slip
    const m = a.length, n = b.length;
    const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
    for (let j = 1; j <= n; j++) d[0][j] = j;
    for (let i = 1; i <= m; i++) {
      for (let j = 1; j <= n; j++) {
        d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
        if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
      }
    }
    return d[m][n];
  }
  function approxIn(text, pat, k) {                  // does some stretch of text lie within k slips of pat?
    let prev = Array.from({ length: pat.length + 1 }, (_, i) => i);
    for (const ch of text) {
      const cur = [0];
      for (let j = 1; j <= pat.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (pat[j - 1] === ch ? 0 : 1));
      if (cur[pat.length] <= k) return true;
      prev = cur;
    }
    return false;
  }
  const slips = (key) => Math.floor(key.length / (HE.test(key) ? 6 : 5));   // slips allowed grow with the length; short keys must be exact (Hebrew keys are already compressed)
  const near = (a, b) => a === b || (a.length >= 3 && editDist(a, b) <= slips(b));

  const titleNames = [answer.title, ...(answer.titleAlt || [])].flatMap((t) => [norm(stripExtras(t)), norm(t)]).filter(Boolean);
  const titleKeys = titleNames.map(keyOf).filter((k) => k.length >= 3);
  const artistNames = [answer.artist, ...(answer.artistAlt || [])].map(norm).filter(Boolean);
  const artistKeys = artistNames.map(keyOf).filter((k) => k.length >= 3);
  const artistWords = new Set(artistNames.flatMap((n) => n.split(' ')).filter((w) => w.length >= 3 && !STOP_WORDS.has(w)));
  const artistWordKeys = [...artistWords].map(keyOf).filter((k) => k.length >= 3);

  const inKeys = (text, keys) => { const tk = keyOf(text); return keys.some((k) => approxIn(tk, k, slips(k))); };
  // doubled letters count once ("הללוייה" is "הללויה", "Bille" is "Bile"), which also covers titles whose key is too short to be fuzzy
  const squeeze = (s) => s.replace(/(\S)\1+/gu, '$1');
  const titleSq = titleNames.map(squeeze), artistSq = artistNames.map(squeeze);
  const titleIn = (text) => titleSq.some((n) => hasPhrase(squeeze(text), n)) || inKeys(text, titleKeys);
  const titleIs = (text) => titleSq.includes(squeeze(text)) || titleKeys.some((k) => near(keyOf(text), k));
  const artistIn = (text) => artistSq.some((n) => hasPhrase(squeeze(text), n)) || inKeys(text, artistKeys)
    || text.split(' ').some((w) => artistWords.has(w) || artistWordKeys.some((k) => near(keyOf(w), k)));

  // a suggestion picked from the catalog: the title and the artist both have to fit
  const judgePick = (p) => titleIn(norm(stripExtras(p.title))) && artistIn(norm(p.artist));
  // free text: just the title, or the title together with the artist
  function judgeText(raw) {
    const text = norm(raw);
    if (!text) return false;
    return titleIs(text) || (titleIn(text) && artistIn(text));
  }

  function closeList() {
    list.hidden = true; active = -1;
    input.setAttribute('aria-expanded', 'false');
    input.removeAttribute('aria-activedescendant');
  }
  function renderList(status) {
    list.textContent = '';
    if (!matches.length && !status) { closeList(); return; }
    if (status) {
      const li = document.createElement('li');
      li.className = 'status'; li.setAttribute('role', 'presentation'); li.textContent = status;
      list.appendChild(li);
    }
    matches.forEach((s, i) => {
      const li = document.createElement('li');
      li.id = 'opt-' + i; li.setAttribute('role', 'option');
      li.setAttribute('aria-selected', i === active ? 'true' : 'false');
      const b = document.createElement('b'); b.textContent = s.title; b.dir = 'auto';
      const sm = document.createElement('small'); sm.textContent = s.artist; sm.dir = 'auto';
      li.append(b, sm);
      li.addEventListener('mousedown', (e) => { e.preventDefault(); pick(i); });
      list.appendChild(li);
    });
    list.hidden = false;
    input.setAttribute('aria-expanded', 'true');
    if (active >= 0) input.setAttribute('aria-activedescendant', 'opt-' + active);
  }

  // suggestions come from the iTunes catalog (millions of songs, Hebrew included);
  // if it is unreachable we fall back to the game's own list
  const catalogCache = new Map();
  let searchTimer = 0, searchCtl = null, searchSeq = 0;
  function cancelSearch() { clearTimeout(searchTimer); if (searchCtl) searchCtl.abort(); searchSeq++; }

  async function searchCatalog(q, signal) {
    if (catalogCache.has(q)) return catalogCache.get(q);
    const r = await fetch('https://itunes.apple.com/search?media=music&entity=song&limit=10&country=IL&term=' + encodeURIComponent(q), { signal });
    if (!r.ok) throw new Error('catalog ' + r.status);
    const out = ((await r.json()).results || [])
      .filter((x) => x.trackName && x.artistName)
      .map((x) => ({ title: x.trackName, artist: x.artistName }));
    catalogCache.set(q, out);
    return out;
  }
  function localMatches(raw) {
    const toks = norm(raw).split(' ').filter(Boolean);
    return SONGS.filter((s) => toks.length && toks.every((t) => s._hay.includes(t))).map((s) => ({ title: s.title, artist: s.artist }));
  }
  function suggestions(found, raw) {
    // the catalog knows nothing about Hebrew spellings of English names, so for Hebrew queries our own list goes first
    const local = localMatches(raw);
    const pool = HE.test(raw) ? [...local, ...(found || [])] : found && found.length ? found : local;
    const guessed = new Set(rec.g.filter((g) => g !== 'skip').map((g) => norm(g.t)));
    const seen = new Set();
    return pool.filter((s) => {
      const key = norm(stripExtras(s.title)) + '|' + norm(s.artist);
      if (seen.has(key) || guessed.has(norm(label(s)))) return false;
      seen.add(key);
      return true;
    }).slice(0, 8);
  }

  function updateList() {
    picked = null;
    const raw = input.value.trim();
    $('guessBtn').disabled = !raw;                  // free text is allowed, so any text can be sent
    cancelSearch();
    if (raw.length < 2) { matches = []; closeList(); return; }
    if (!matches.length) renderList('מחפש...');
    const seq = searchSeq;
    searchTimer = setTimeout(async () => {
      searchCtl = new AbortController();
      let found = null;
      try { found = await searchCatalog(raw, searchCtl.signal); }
      catch (e) { if (e.name === 'AbortError') return; }
      if (seq !== searchSeq) return;
      matches = suggestions(found, raw);
      active = -1;
      renderList(matches.length ? '' : 'אין הצעות. אפשר לנחש בטקסט חופשי');
    }, 280);
  }
  function pick(i) {
    const s = matches[i];
    cancelSearch();
    picked = { ...s, text: label(s) };
    input.value = picked.text;
    $('guessBtn').disabled = false;
    closeList();
  }
  function guessFromInput() {
    const text = input.value.trim();
    if (!text) return;
    const key = norm(text);
    if (rec.g.some((g) => g !== 'skip' && norm(g.t) === key)) { toast('כבר ניחשתם את זה'); return; }
    submit({ t: text, ok: picked && picked.text === text ? judgePick(picked) : judgeText(text) });
  }
  input.addEventListener('input', updateList);
  input.addEventListener('blur', () => setTimeout(closeList, 120));
  input.addEventListener('keydown', (e) => {
    const open = !list.hidden;
    if (e.key === 'ArrowDown' && matches.length) { e.preventDefault(); active = (active + 1) % matches.length; renderList(); }
    else if (e.key === 'ArrowUp' && matches.length) { e.preventDefault(); active = (active - 1 + matches.length) % matches.length; renderList(); }
    else if (e.key === 'Escape') { closeList(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (open && active >= 0) pick(active);
      else guessFromInput();
    }
  });
  $('guessBtn').addEventListener('click', guessFromInput);
  $('skipBtn').addEventListener('click', () => submit('skip'));
  $('play').addEventListener('click', () => { if (clip) stopClip(); else startClip(); });

  // ---------- share + countdown ----------
  const EMOJI = { win: '🟩', bad: '🟥', skip: '⬛', '': '⬜' };
  $('shareBtn').addEventListener('click', async () => {
    const text = `מה השיר? #${dayNo}\n🔊${squaresFor(rec.g).map((c) => EMOJI[c]).join('')}\n${SHARE_URL}`;
    try { await navigator.clipboard.writeText(text); toast('התוצאה הועתקה'); }
    catch (e) {
      const ta = document.createElement('textarea');
      ta.value = text; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); toast('התוצאה הועתקה'); } catch (_) { toast('לא הצלחתי להעתיק'); }
      ta.remove();
    }
  });

  function tickCountdown() {
    if (!rec.done) return;
    const now = new Date();
    const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    const ms = Math.max(0, next - now);
    const p = (n) => String(n).padStart(2, '0');
    $('countdown').textContent = `${p(Math.floor(ms / 3600000))}:${p(Math.floor(ms / 60000) % 60)}:${p(Math.floor(ms / 1000) % 60)}`;
    if (ms === 0 && !previewMode) location.reload();
  }
  setInterval(tickCountdown, 1000);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && !previewMode && dayNumberOf(new Date()) !== today) location.reload();
  });

  // ---------- boot ----------
  $('dayLabel').textContent = previewMode ? `תצוגה מקדימה: שיר מספר ${dayNo}` : `שיר מספר ${dayNo}`;
  // best effort: a generic title for the system media controls instead of the video's own
  // (the iframe is another origin, so whether the browser prefers this one cannot be checked from here)
  try { navigator.mediaSession.metadata = new MediaMetadata({ title: 'מה השיר?', artist: 'השיר היומי' }); } catch (e) { /* unsupported */ }
  buildTimeline();
  render();
  if (rec.done) $('playerWrap').classList.add('revealed');
  loadYouTube();
})();
</script>
</body>
</html>
